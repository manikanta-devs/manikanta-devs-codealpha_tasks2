<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>SONIQ — Advanced Music Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;600&family=DM+Mono:wght@300;400;500&family=Outfit:wght@200;300;400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#060606;--surface:#101010;--surface2:#181818;--surface3:#222;
  --glass:rgba(255,255,255,0.04);--glass-border:rgba(255,255,255,0.07);
  --gold:#C9A84C;--gold-dim:#7A5E28;--gold-glow:rgba(201,168,76,0.15);
  --amber:#E8C04A;--rose:#E05C5C;--teal:#3CDFB0;
  --text:#F0EBE0;--text-mid:#8A8378;--text-dim:#4A4640;
  --accent:var(--gold);
  --radius:16px;--radius-sm:8px;
}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Outfit',sans-serif;font-weight:300;overflow:hidden;}
::-webkit-scrollbar{width:3px;height:3px;}
::-webkit-scrollbar-thumb{background:var(--gold-dim);border-radius:2px;}
button{font-family:'Outfit',sans-serif;}

/* ── App Shell ───────────────────────────────── */
.app{display:grid;grid-template-columns:270px 1fr 300px;height:100vh;overflow:hidden;}
.col-left{border-right:1px solid var(--glass-border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;}
.col-main{display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden;background:var(--bg);}
.col-right{border-left:1px solid var(--glass-border);background:var(--surface);display:flex;flex-direction:column;overflow:hidden;}

/* ── Drag Overlay ────────────────────────────── */
.drag-overlay{position:fixed;inset:0;background:rgba(6,6,6,0.9);z-index:999;display:none;align-items:center;justify-content:center;flex-direction:column;gap:16px;border:2px dashed var(--gold);pointer-events:none;}
.drag-overlay.show{display:flex;}
.drag-overlay svg{opacity:0.5;}
.drag-overlay p{font-family:'DM Mono',monospace;font-size:13px;letter-spacing:3px;color:var(--gold);text-transform:uppercase;}

/* ── Sidebar Logo ────────────────────────────── */
.logo-wrap{padding:24px 24px 18px;border-bottom:1px solid var(--glass-border);flex-shrink:0;}
.logo{font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;letter-spacing:8px;color:var(--gold);}
.logo-sub{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;color:var(--text-dim);margin-top:2px;text-transform:uppercase;}

/* ── Sidebar Nav ─────────────────────────────── */
.snav{display:flex;flex-direction:column;gap:2px;padding:12px 16px;flex-shrink:0;border-bottom:1px solid var(--glass-border);}
.snav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:12px;font-weight:400;color:var(--text-mid);transition:all 0.15s;border:1px solid transparent;}
.snav-item:hover{background:var(--glass);color:var(--text);}
.snav-item.active{background:var(--gold-glow);color:var(--gold);border-color:rgba(201,168,76,0.2);}

/* ── Search ──────────────────────────────────── */
.search-wrap{padding:10px 16px;flex-shrink:0;}
.search-box{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-border);border-radius:8px;padding:8px 12px;}
.search-box:focus-within{border-color:var(--gold-dim);}
.search-box input{background:none;border:none;outline:none;color:var(--text);font-family:'Outfit',sans-serif;font-size:12px;width:100%;font-weight:300;}
.search-box input::placeholder{color:var(--text-dim);}

/* ── Genre Pills ─────────────────────────────── */
.genre-row{display:flex;gap:5px;padding:8px 16px;overflow-x:auto;flex-shrink:0;}
.genre-row::-webkit-scrollbar{height:2px;}
.pill{flex-shrink:0;padding:3px 10px;border-radius:20px;font-size:10px;font-family:'DM Mono',monospace;letter-spacing:1px;cursor:pointer;background:var(--glass);border:1px solid var(--glass-border);color:var(--text-dim);transition:all 0.15s;}
.pill:hover{color:var(--text);border-color:var(--gold-dim);}
.pill.active{background:var(--gold-glow);border-color:var(--gold);color:var(--gold);}

/* ── Playlist ────────────────────────────────── */
.playlist-wrap{flex:1;overflow-y:auto;padding:4px 10px;}
.track-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;cursor:pointer;transition:background 0.12s;}
.track-item:hover{background:var(--glass);}
.track-item.playing{background:var(--gold-glow);}
.track-item.playing .track-name{color:var(--gold);}
.track-num{font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);width:16px;text-align:center;flex-shrink:0;}
.playing-bars{display:none;align-items:flex-end;gap:2px;width:16px;height:12px;flex-shrink:0;}
.track-item.playing .track-num{display:none;}
.track-item.playing .playing-bars{display:flex;}
.bar{width:3px;background:var(--gold);border-radius:1px;animation:barsAnim 0.6s ease-in-out infinite alternate;}
.bar:nth-child(2){animation-delay:.15s;}.bar:nth-child(3){animation-delay:.3s;}
@keyframes barsAnim{from{height:2px;}to{height:12px;}}
.paused .bar{animation-play-state:paused;}
.track-color-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.track-info-inner{flex:1;min-width:0;}
.track-name{font-size:12px;font-weight:400;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-meta{font-size:10px;color:var(--text-dim);margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.track-dur{font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);flex-shrink:0;}
.track-del{opacity:0;cursor:pointer;color:var(--text-dim);padding:2px 4px;font-size:10px;flex-shrink:0;}
.track-item:hover .track-del{opacity:1;}
.track-del:hover{color:var(--rose);}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;gap:10px;color:var(--text-dim);text-align:center;padding:30px;}
.empty-state svg{opacity:0.2;}
.empty-state p{font-size:12px;line-height:1.7;}

/* ── Upload ──────────────────────────────────── */
.upload-area{padding:14px;border-top:1px solid var(--glass-border);flex-shrink:0;}
.upload-btn{width:100%;padding:10px;background:var(--glass);border:1px dashed var(--gold-dim);border-radius:6px;color:var(--gold);font-family:'DM Mono',monospace;font-size:10px;letter-spacing:2px;cursor:pointer;transition:all 0.2s;text-transform:uppercase;text-align:center;}
.upload-btn:hover{background:var(--gold-glow);border-style:solid;}
#fileInput{display:none;}

/* ── Main Column ─────────────────────────────── */
.ambient{position:absolute;width:500px;height:500px;border-radius:50%;background:radial-gradient(circle,var(--gold-glow) 0%,transparent 70%);filter:blur(80px);pointer-events:none;opacity:0;transition:opacity 1.2s;}
.ambient.on{opacity:1;}
.art-wrap{position:relative;width:260px;height:260px;flex-shrink:0;}
.art-ring{position:absolute;inset:-16px;border-radius:50%;border:1.5px solid transparent;background:conic-gradient(var(--gold),var(--amber),var(--gold-dim),var(--gold)) border-box;-webkit-mask:linear-gradient(#fff 0 0) padding-box,linear-gradient(#fff 0 0);-webkit-mask-composite:destination-out;mask-composite:exclude;opacity:0;transition:opacity 0.8s;animation:spin 14s linear infinite paused;}
.art-ring.on{opacity:1;animation-play-state:running;}
@keyframes spin{to{transform:rotate(360deg);}}
.art-canvas{width:260px;height:260px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 0 1px var(--glass-border),0 30px 80px rgba(0,0,0,0.7);position:relative;z-index:1;}
#vizCanvas{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:320px;height:320px;pointer-events:none;z-index:0;}
.art-placeholder{display:flex;flex-direction:column;align-items:center;gap:8px;color:var(--text-dim);}
.art-placeholder svg{opacity:0.3;}
.art-placeholder span{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;text-transform:uppercase;}
.viz-mode-btn{position:absolute;bottom:-32px;left:50%;transform:translateX(-50%);background:var(--glass);border:1px solid var(--glass-border);border-radius:20px;padding:4px 16px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;color:var(--text-dim);cursor:pointer;transition:all 0.2s;text-transform:uppercase;white-space:nowrap;}
.viz-mode-btn:hover{color:var(--text);border-color:var(--gold-dim);}

/* ── Now Playing ─────────────────────────────── */
.now-playing{margin-top:48px;text-align:center;width:100%;max-width:380px;}
.np-badge{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:4px;color:var(--gold);text-transform:uppercase;margin-bottom:8px;opacity:0.8;}
.np-title{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:400;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color 0.5s;}
.np-artist{font-size:12px;color:var(--text-mid);margin-top:5px;}

/* ── Progress ────────────────────────────────── */
.progress-wrap{margin-top:24px;width:100%;max-width:400px;}
.progress-times{display:flex;justify-content:space-between;font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);margin-bottom:7px;}
.progress-track{height:3px;background:var(--surface2);border-radius:2px;cursor:pointer;position:relative;}
.progress-track::before{content:'';position:absolute;inset:-8px 0;} /* hit area */
.progress-buffered{position:absolute;height:100%;background:var(--surface3);border-radius:2px;pointer-events:none;}
.progress-fill{position:absolute;height:100%;background:linear-gradient(90deg,var(--gold-dim),var(--amber));border-radius:2px;transition:width 0.1s linear;pointer-events:none;}
.progress-thumb{position:absolute;top:50%;right:-5px;transform:translateY(-50%);width:10px;height:10px;background:var(--amber);border-radius:50%;opacity:0;transition:opacity 0.2s;box-shadow:0 0 8px var(--gold);pointer-events:none;}
.progress-track:hover .progress-thumb{opacity:1;}

/* ── Controls ────────────────────────────────── */
.controls{display:flex;align-items:center;gap:16px;margin-top:24px;}
.ctrl-btn{background:none;border:none;cursor:pointer;color:var(--text-mid);display:flex;align-items:center;justify-content:center;border-radius:50%;padding:8px;transition:all 0.15s;}
.ctrl-btn:hover{color:var(--text);background:var(--glass);}
.ctrl-btn.active{color:var(--gold);}
.play-btn{width:60px;height:60px;background:linear-gradient(135deg,var(--gold),var(--gold-dim));border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#060606;box-shadow:0 0 28px var(--gold-glow),0 8px 20px rgba(0,0,0,0.5);transition:all 0.2s;flex-shrink:0;}
.play-btn:hover{transform:scale(1.06);box-shadow:0 0 40px rgba(201,168,76,0.3),0 8px 28px rgba(0,0,0,0.6);}
.play-btn:active{transform:scale(0.97);}

/* ── Extra Controls Row ──────────────────────── */
.extra-row{display:flex;align-items:center;gap:12px;margin-top:16px;}
.speed-select{background:var(--glass);border:1px solid var(--glass-border);border-radius:6px;color:var(--text-mid);font-family:'DM Mono',monospace;font-size:10px;padding:4px 8px;cursor:pointer;outline:none;transition:border-color 0.2s;}
.speed-select:hover{border-color:var(--gold-dim);}
.speed-select option{background:var(--surface2);}
.timer-pill{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--glass-border);border-radius:6px;padding:4px 10px;cursor:pointer;font-family:'DM Mono',monospace;font-size:10px;color:var(--text-dim);transition:all 0.2s;}
.timer-pill:hover{border-color:var(--gold-dim);color:var(--text);}
.timer-pill.active{border-color:var(--rose);color:var(--rose);}
.crossfade-wrap{display:flex;align-items:center;gap:8px;font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);}
.crossfade-wrap input{width:60px;}
.fav-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);padding:6px;transition:color 0.2s;}
.fav-btn:hover{color:var(--rose);}
.fav-btn.active{color:var(--rose);}
.fav-btn.active svg{fill:var(--rose);}

/* ── Right Panel ─────────────────────────────── */
.panel-tabs{display:flex;border-bottom:1px solid var(--glass-border);flex-shrink:0;}
.tab{flex:1;padding:14px 6px;text-align:center;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--text-dim);cursor:pointer;border-bottom:2px solid transparent;transition:all 0.2s;}
.tab:hover{color:var(--text-mid);}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}
.panel-content{flex:1;overflow-y:auto;display:none;}
.panel-content.active{display:block;}

/* ── Queue panel ─────────────────────────────── */
.queue-item{display:flex;align-items:center;gap:10px;padding:10px 18px;border-bottom:1px solid var(--glass-border);cursor:pointer;transition:background 0.12s;}
.queue-item:hover{background:var(--glass);}
.queue-item.current{background:var(--gold-glow);}
.queue-art{width:38px;height:38px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:15px;color:var(--gold-dim);border:1px solid var(--glass-border);flex-shrink:0;}
.queue-info{flex:1;min-width:0;}
.queue-name{font-size:12px;font-weight:400;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.queue-item.current .queue-name{color:var(--gold);}
.queue-artist{font-size:10px;color:var(--text-dim);margin-top:1px;}
.queue-dur{font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);}

/* ── Volume Panel ────────────────────────────── */
.vol-section{padding:18px 18px 12px;border-bottom:1px solid var(--glass-border);}
.panel-label{font-family:'DM Mono',monospace;font-size:8px;letter-spacing:3px;text-transform:uppercase;color:var(--text-dim);margin-bottom:12px;}
.vol-row{display:flex;align-items:center;gap:10px;}
.vol-row svg{color:var(--text-dim);flex-shrink:0;}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;background:var(--surface2);border-radius:2px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 0 5px var(--gold-glow);}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:var(--gold);cursor:pointer;border:none;}
.vol-pct{font-family:'DM Mono',monospace;font-size:9px;color:var(--text-dim);width:26px;text-align:right;}

/* ── EQ Panel ────────────────────────────────── */
.eq-section{padding:16px 18px;flex:1;overflow-y:auto;}
.eq-presets{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:16px;}
.eq-preset{padding:4px 10px;border-radius:20px;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:1px;cursor:pointer;background:var(--glass);border:1px solid var(--glass-border);color:var(--text-dim);transition:all 0.15s;}
.eq-preset:hover{color:var(--text);border-color:var(--gold-dim);}
.eq-preset.active{background:var(--gold-glow);border-color:var(--gold);color:var(--gold);}
.eq-bands{display:flex;gap:0;align-items:flex-end;height:120px;padding:0 4px;margin-bottom:8px;}
.eq-band{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;}
.eq-slider-wrap{flex:1;display:flex;align-items:center;justify-content:center;position:relative;width:100%;}
input[type=range].eq-slider{writing-mode:vertical-lr;direction:rtl;-webkit-appearance:slider-vertical;width:100%;height:90px;background:transparent;}
input[type=range].eq-slider::-webkit-slider-runnable-track{width:3px;background:var(--surface2);border-radius:2px;}
input[type=range].eq-slider::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);cursor:pointer;box-shadow:0 0 6px var(--gold-glow);}
input[type=range].eq-slider::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold);cursor:pointer;border:none;}
.eq-label{font-family:'DM Mono',monospace;font-size:8px;color:var(--text-dim);letter-spacing:1px;}
.eq-val{font-family:'DM Mono',monospace;font-size:8px;color:var(--text-mid);}

/* ── Track Info Tab ──────────────────────────── */
.info-section{padding:16px 18px;border-bottom:1px solid var(--glass-border);}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--glass-border);}
.info-row:last-child{border-bottom:none;}
.info-key{font-size:11px;color:var(--text-dim);}
.info-val{font-family:'DM Mono',monospace;font-size:10px;color:var(--text);}

/* ── Mini Player ─────────────────────────────── */
#miniPlayer{position:fixed;bottom:0;left:0;right:0;height:72px;background:rgba(10,10,10,0.95);backdrop-filter:blur(20px);border-top:1px solid var(--glass-border);display:none;align-items:center;padding:0 24px;gap:16px;z-index:100;box-shadow:0 -8px 32px rgba(0,0,0,0.5);}
#miniPlayer.show{display:flex;}
.mini-art{width:44px;height:44px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--gold-dim);border:1px solid var(--glass-border);flex-shrink:0;}
.mini-info{flex:1;min-width:0;}
.mini-title{font-size:13px;font-weight:400;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mini-artist{font-size:11px;color:var(--text-dim);}
.mini-prog{position:absolute;top:0;left:0;right:0;height:2px;background:var(--surface2);}
.mini-prog-fill{height:100%;background:var(--gold);transition:width 0.2s linear;}
.mini-controls{display:flex;align-items:center;gap:8px;}
.mini-btn{background:none;border:none;cursor:pointer;color:var(--text-mid);padding:6px;border-radius:50%;transition:all 0.15s;}
.mini-btn:hover{color:var(--text);}
.mini-play{width:38px;height:38px;background:var(--gold);border:none;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#060606;transition:all 0.15s;flex-shrink:0;}
.mini-play:hover{background:var(--amber);}
.expand-btn{background:none;border:none;cursor:pointer;color:var(--text-dim);padding:8px;transition:color 0.15s;}
.expand-btn:hover{color:var(--gold);}

/* ── Sleep Timer Modal ───────────────────────── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--surface2);border:1px solid var(--glass-border);border-radius:16px;padding:28px;width:300px;box-shadow:0 40px 100px rgba(0,0,0,0.6);}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;margin-bottom:20px;color:var(--gold);}
.modal-options{display:flex;flex-direction:column;gap:8px;}
.modal-opt{padding:10px 16px;border-radius:8px;cursor:pointer;font-size:13px;color:var(--text-mid);border:1px solid var(--glass-border);background:var(--glass);transition:all 0.15s;}
.modal-opt:hover{border-color:var(--gold-dim);color:var(--text);}
.modal-opt.active{border-color:var(--gold);color:var(--gold);background:var(--gold-glow);}
.modal-cancel{width:100%;margin-top:16px;padding:10px;background:none;border:1px solid var(--glass-border);border-radius:8px;color:var(--text-dim);cursor:pointer;font-size:12px;font-family:'DM Mono',monospace;letter-spacing:2px;transition:all 0.15s;}
.modal-cancel:hover{border-color:var(--rose);color:var(--rose);}

/* ── Shortcuts overlay ───────────────────────── */
.shortcuts-modal{display:none;}
.shortcuts-modal.show{display:flex;}
.shortcut-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--glass-border);}
.shortcut-row:last-child{border-bottom:none;}
.shortcut-key{font-family:'DM Mono',monospace;font-size:10px;background:var(--surface);border:1px solid var(--glass-border);bo
