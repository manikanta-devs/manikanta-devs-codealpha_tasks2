// ═══════════════════════════════════════
// MUTE / BLOCK MANAGERS
// ═══════════════════════════════════════
function showMutedUsers(){
  const users=[...MUTED].map(U).filter(Boolean);
  openSheet(users.length
    ?users.map(u=>({icon:u.emoji,label:u.name,desc:'Tap to unmute @'+u.username,action:()=>{MUTED.delete(u.id);persist();updateMutedBlockedCounts();renderFeed();showToast('Unmuted @'+u.username);}}))
    :[{icon:'✅',label:'No muted users',desc:'',action:()=>{}}]);
}
function showBlockedUsers(){
  const users=[...BLOCKED].map(U).filter(Boolean);
  openSheet(users.length
    ?users.map(u=>({icon:u.emoji,label:u.name,desc:'Tap to unblock @'+u.username,action:()=>{BLOCKED.delete(u.id);persist();updateMutedBlockedCounts();renderFeed();showToast('Unblocked @'+u.username);}}))
    :[{icon:'✅',label:'No blocked users',desc:'',action:()=>{}}]);
}

// ═══════════════════════════════════════
// BOTTOM SHEET (generic action menu)
// ═══════════════════════════════════════
function openSheet(actions){
  const s=document.createElement('div');
  s.style.cssText='position:fixed;inset:0;z-index:450;background:rgba(10,8,20,0.55);display:flex;align-items:flex-end;justify-content:center;';
  const rows=actions.map((a,i)=>`
    <button data-idx="${i}" style="display:flex;align-items:center;gap:14px;padding:14px 20px;cursor:pointer;
      width:100%;background:none;border:none;text-align:left;transition:background 0.1s;
      font-size:15px;color:${a.danger?'var(--p3)':'var(--t1)'};border-bottom:1px solid var(--bd);"
      onmouseover="this.style.background='var(--bg3)'" onmouseout="this.style.background=''">
      <div style="width:42px;height:42px;border-radius:12px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;">${a.icon||'•'}</div>
      <div><div style="font-weight:600;">${esc(a.label||'')}</div>${a.desc?`<div style="font-size:12px;color:var(--t2);margin-top:1px;">${esc(a.desc)}</div>`:''}</div>
    </button>`).join('');
  s.innerHTML=`<div style="background:var(--bg2);border-radius:24px 24px 0 0;width:100%;max-width:540px;max-height:80vh;overflow-y:auto;">
    <div style="padding:8px;text-align:center;"><div style="width:36px;height:4px;background:var(--bd2);border-radius:2px;margin:0 auto;"></div></div>
    ${rows}
    <button onclick="this.closest('[style*=fixed]').remove()" style="width:100%;padding:14px;background:var(--bg3);border:none;border-top:1px solid var(--bd);cursor:pointer;font-size:15px;font-weight:700;color:var(--t2);">Cancel</button>
  </div>`;
  s.addEventListener('click',e=>{if(e.target===s)s.remove();});
  s.querySelectorAll('button[data-idx]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const i=parseInt(btn.getAttribute('data-idx'));
      s.remove();
      if(actions[i]&&actions[i].action) actions[i].action();
    });
  });
  document.body.appendChild(s);
}

// ═══════════════════════════════════════
// UTILS
// ═══════════════════════════════════════
function timeAgo(ts){const d=(Date.now()-ts)/1000;if(d<60)return'now';if(d<3600)return Math.floor(d/60)+'m';if(d<86400)return Math.floor(d/3600)+'h';if(d<604800)return Math.floor(d/86400)+'d';return new Date(ts).toLocaleDateString('en',{month:'short',day:'numeric'});}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function fmtNum(n){if(n>=1000000)return(n/1000000).toFixed(1)+'M';if(n>=1000)return(n/1000).toFixed(1)+'K';return n;}
let _toastT;
function showToast(msg){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(_toastT);_toastT=setTimeout(()=>el.classList.remove('show'),2600);}

// Modal helpers
function openModal(id){const el=document.getElementById(id);if(el)el.classList.add('open');}
function closeModal(id){const el=document.getElementById(id);if(el)el.classList.remove('open');}
document.querySelectorAll('.modal-bg').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)m.classList.remove('open');}));

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
:root{
  --blue:#1A8CD8;--blue-h:rgba(26,140,216,0.12);--blue-d:rgba(26,140,216,0.2);
  --green:#00BA7C;--green-d:rgba(0,186,124,0.15);
  --red:#F4212E;--red-d:rgba(244,33,46,0.12);
  --amber:#FFB400;--amber-d:rgba(255,180,0,0.15);
  --purple:#7856FF;--purple-d:rgba(120,86,255,0.15);
  --p1:#6C63FF;--p2:#C84BFF;--p3:#FF6B6B;
  --grad:linear-gradient(135deg,#6C63FF,#C84BFF);
  --grad2:linear-gradient(135deg,#FF6B6B,#FF8E53);
  --shadow:0 8px 32px rgba(108,99,255,0.28);
  --shadow2:0 4px 16px rgba(108,99,255,0.2);
  --r:16px;--r-sm:10px;--rf:999px;
  --font:'Plus Jakarta Sans',sans-serif;
  --sb:env(safe-area-inset-bottom,0px);
}
[data-theme="dark"]{
  --bg:#0A0814;--bg1:#13102A;--bg2:#1A1735;--bg3:#221F42;--bg4:#2C2850;
  --bd:rgba(108,99,255,0.15);--bd2:rgba(108,99,255,0.28);
  --t1:#E8E5FF;--t2:#8B88B8;--t3:#4A4870;--w:#FFFFFF;
  --blue:#6C63FF;--blue-h:rgba(108,99,255,0.12);--blue-d:rgba(108,99,255,0.2);
}
[data-theme="light"]{
  --bg:#F4F2FF;--bg1:#FFFFFF;--bg2:#FFFFFF;--bg3:#EDE9FF;--bg4:#E0D9FF;
  --bd:rgba(108,99,255,0.12);--bd2:rgba(108,99,255,0.22);
  --t1:#1A1240;--t2:#6B6899;--t3:#A8A4C8;--w:#1A1240;
  --blue:#6C63FF;--blue-h:rgba(108,99,255,0.1);--blue-d:rgba(108,99,255,0.18);
}

/* ─── LANDING PAGE ───────────────────────────────── */
#landingScreen{display:none;min-height:100vh;overflow-x:hidden;}
#landingScreen.active{display:block;}
.lp-nav{position:fixed;top:0;left:0;right:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:14px 6%;background:rgba(244,242,255,0.88);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);}
[data-theme="dark"] .lp-nav{background:rgba(10,8,20,0.88);}
.lp-logo{display:flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;}
.lp-logo-ico{width:36px;height:36px;background:var(--grad);border-radius:11px;display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow2);}
.lp-logo-txt{font-size:21px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;letter-spacing:-0.5px;}
.lp-nav-right{display:flex;align-items:center;gap:8px;}
.lp-btn-ghost{padding:8px 18px;border:1.5px solid var(--bd2);border-radius:var(--rf);background:none;font-size:14px;font-weight:600;cursor:pointer;color:var(--t2);transition:all 0.15s;}
.lp-btn-ghost:hover{color:var(--t1);border-color:var(--p1);}
.lp-btn-cta{padding:9px 22px;background:var(--grad);color:#fff;border:none;border-radius:var(--rf);font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow2);transition:all 0.2s;}
.lp-btn-cta:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
.lp-theme{width:34px;height:34px;border-radius:50%;background:var(--bg3);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--t2);}
/* Hero */
.hero{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:100px 6% 60px;position:relative;overflow:hidden;}
.hero-blob{position:absolute;border-radius:50%;filter:blur(80px);pointer-events:none;z-index:0;}
.blob-a{width:480px;height:480px;background:#6C63FF;opacity:0.22;top:-80px;right:-80px;}
.blob-b{width:380px;height:380px;background:#C84BFF;opacity:0.18;bottom:-60px;left:-60px;}
.blob-c{width:260px;height:260px;background:#FF6B6B;opacity:0.12;top:42%;left:44%;}
.hero-inner{max-width:1180px;width:100%;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;position:relative;z-index:1;}
@media(max-width:860px){.hero-inner{grid-template-columns:1fr;text-align:center;}.hero-mockup{display:none;}.hero-btns,.hero-stats{justify-content:center;}}
.hero-badge{display:inline-flex;align-items:center;gap:7px;padding:5px 14px;background:var(--bg3);border:1px solid var(--bd2);border-radius:var(--rf);font-size:12px;font-weight:600;color:var(--p1);margin-bottom:18px;}
.hero-badge-dot{width:6px;height:6px;background:var(--p3);border-radius:50%;animation:lpulse 2s ease-in-out infinite;}
@keyframes lpulse{0%,100%{opacity:1;transform:scale(1);}50%{opacity:0.4;transform:scale(0.75);}}
.hero-h1{font-size:clamp(34px,5.5vw,70px);font-weight:900;line-height:1.05;letter-spacing:-2px;margin-bottom:18px;}
.hero-grad{background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hero-p{font-size:17px;color:var(--t2);line-height:1.65;margin-bottom:32px;max-width:460px;}
.hero-btns{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px;}
.hero-btn-primary{padding:13px 30px;background:var(--grad);color:#fff;border:none;border-radius:var(--rf);font-size:15px;font-weight:700;cursor:pointer;box-shadow:var(--shadow);transition:all 0.2s;display:flex;align-items:center;gap:8px;}
.hero-btn-primary:hover{transform:translateY(-2px);box-shadow:0 12px 36px rgba(108,99,255,0.38);}
.hero-btn-sec{padding:13px 28px;background:var(--bg2);color:var(--t1);border:1.5px solid var(--bd2);border-radius:var(--rf);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;}
.hero-btn-sec:hover{background:var(--bg3);transform:translateY(-2px);}
.hero-stats{display:flex;gap:24px;flex-wrap:wrap;}
.hs-num{font-size:26px;font-weight:800;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
.hs-lbl{font-size:12px;color:var(--t2);}
/* Phone mockup */
.hero-mockup{position:relative;display:flex;align-items:center;justify-content:center;}
.phone-wrap{position:relative;}
.phone-frame{width:265px;height:520px;background:var(--bg2);border-radius:38px;border:9px solid var(--bg4);box-shadow:0 36px 90px rgba(108,99,255,0.2),inset 0 0 0 1px var(--bd2);overflow:hidden;position:relative;}
.phone-notch{width:90px;height:20px;background:var(--bg4);border-radius:0 0 12px 12px;margin:0 auto;position:absolute;top:0;left:50%;transform:translateX(-50%);z-index:2;}
.phone-screen{padding:26px 12px 12px;height:100%;display:flex;flex-direction:column;gap:10px;overflow:hidden;}
.ph-stories{display:flex;gap:8px;}
.ph-story{width:38px;height:50px;border-radius:10px;flex-shrink:0;}
.ph-post{background:var(--bg3);border-radius:12px;padding:10px;}
.ph-ph{display:flex;align-items:center;gap:7px;margin-bottom:7px;}
.ph-av{width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;}
.ph-pname{font-size:10px;font-weight:700;color:var(--t1);}
.ph-ptxt{font-size:9px;color:var(--t2);line-height:1.4;}
.ph-acts{display:flex;gap:6px;margin-top:7px;}
.ph-act{width:18px;height:5px;background:var(--bd2);border-radius:3px;}
.float-card{position:absolute;background:var(--bg2);border-radius:14px;box-shadow:0 10px 36px rgba(108,99,255,0.14);border:1px solid var(--bd);padding:10px 14px;display:flex;align-items:center;gap:9px;animation:lFloat 4s ease-in-out infinite;}
.float-card:nth-child(2){animation-delay:2s;}
.fc-l{right:-62px;top:70px;}
.fc-r{left:-72px;bottom:90px;}
@keyframes lFloat{0%,100%{transform:translateY(0);}50%{transform:translateY(-9px);}}
.fc-ico{width:32px;height:32px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.fc-lbl{font-size:11px;font-weight:700;color:var(--t1);}
.fc-sub{font-size:9px;color:var(--t2);margin-top:1px;}
/* Features grid */
.lp-section{padding:72px 6%;max-width:1180px;margin:0 auto;}
.lp-sect-lbl{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:700;color:var(--p1);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;}
.lp-sect-dot{width:6px;height:6px;background:var(--p1);border-radius:50%;}
.lp-sect-h{font-size:clamp(26px,3.8vw,44px);font-weight:800;letter-spacing:-1px;margin-bottom:14px;line-height:1.1;}
.feat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-top:44px;}
.feat-card{background:var(--bg2);border:1px solid var(--bd);border-radius:22px;padding:28px;transition:all 0.3s;position:relative;overflow:hidden;}
.feat-card:hover{transform:translateY(-5px);box-shadow:0 18px 54px rgba(108,99,255,0.13);border-color:var(--bd2);}
.feat-ico{width:52px;height:52px;border-radius:14px;background:var(--bg3);display:flex;align-items:center;justify-content:center;margin-bottom:18px;transition:all 0.3s;}
.feat-card:hover .feat-ico{background:var(--grad);box-shadow:var(--shadow2);}
.feat-card:hover .feat-ico svg{stroke:#fff;}
.feat-h{font-size:17px;font-weight:700;margin-bottom:8px;color:var(--t1);}
.feat-p{font-size:13px;color:var(--t2);line-height:1.65;}
/* Stats banner */
.stats-banner{background:var(--grad);border-radius:26px;margin:0 6% 72px;padding:48px 6%;text-align:center;position:relative;overflow:hidden;}
.stats-banner::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='50' height='50' viewBox='0 0 50 50' xmlns='http://www.w3.org/2000/svg'%3E%3Ccircle cx='25' cy='25' r='15' fill='none' stroke='rgba(255,255,255,0.06)' stroke-width='1'/%3E%3C/svg%3E") repeat;}
.stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:28px;max-width:800px;margin:28px auto 0;}
@media(max-width:560px){.stats-grid{grid-template-columns:1fr;}}
.sb-n{font-size:36px;font-weight:900;color:#fff;letter-spacing:-1px;}
.sb-l{font-size:13px;color:rgba(255,255,255,0.72);margin-top:4px;}
/* Testimonials */
.test-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(265px,1fr));gap:18px;margin-top:44px;}
.test-card{background:var(--bg2);border:1px solid var(--bd);border-radius:18px;padding:22px;}
.test-stars{color:#FFB400;font-size:13px;margin-bottom:10px;}
.test-txt{font-size:13px;color:var(--t1);line-height:1.7;margin-bottom:14px;font-style:italic;}
.test-user{display:flex;align-items:center;gap:9px;}
.test-av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;}
.test-name{font-size:13px;font-weight:700;}
.test-handle{font-size:11px;color:var(--t2);}
/* CTA section */
.cta-sec{background:var(--grad);border-radius:28px;margin:0 6% 72px;padding:56px 6%;text-align:center;position:relative;overflow:hidden;}
.cta-h{font-size:clamp(26px,3.8vw,44px);font-weight:900;color:#fff;margin-bottom:12px;letter-spacing:-0.8px;}
.cta-p{font-size:16px;color:rgba(255,255,255,0.78);margin-bottom:30px;}
.cta-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;}
.cta-w{padding:13px 28px;background:#fff;color:var(--p1);border:none;border-radius:var(--rf);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;box-shadow:0 4px 18px rgba(0,0,0,0.15);}
.cta-w:hover{transform:translateY(-2px);box-shadow:0 8px 28px rgba(0,0,0,0.2);}
.cta-o{padding:13px 28px;background:transparent;color:#fff;border:2px solid rgba(255,255,255,0.55);border-radius:var(--rf);font-size:15px;font-weight:700;cursor:pointer;transition:all 0.2s;}
.cta-o:hover{background:rgba(255,255,255,0.1);border-color:#fff;}
/* Footer */
.lp-footer{background:var(--bg2);border-top:1px solid var(--bd);padding:44px 6% 28px;}
.footer-inner{max-width:1180px;margin:0 auto;}
.footer-top{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:36px;margin-bottom:36px;}
@media(max-width:680px){.footer-top{grid-template-columns:1fr 1fr;}}
.footer-brand p{font-size:13px;color:var(--t2);margin-top:10px;line-height:1.6;max-width:240px;}
.footer-col h4{font-size:13px;font-weight:700;margin-bottom:14px;color:var(--t1);}
.footer-col a{display:block;font-size:12px;color:var(--t2);margin-bottom:9px;cursor:pointer;transition:color 0.15s;}
.footer-col a:hover{color:var(--p1);}
.footer-bot{border-top:1px solid var(--bd);padding-top:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.footer-copy{font-size:12px;color:var(--t3);}
/* ─── AUTH OVERLAY / MODAL ─────────────────────── */
#authOverlay{position:fixed;inset:0;z-index:500;background:rgba(10,8,20,0.72);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:20px;}
#authOverlay.open{display:flex;}
.auth-box{width:100%;max-width:430px;background:var(--bg2);border-radius:26px;overflow:hidden;box-shadow:0 40px 100px rgba(108,99,255,0.22);position:relative;animation:modalIn 0.32s cubic-bezier(0.34,1.56,0.64,1);}
@keyframes modalIn{from{opacity:0;transform:scale(0.88) translateY(20px);}to{opacity:1;transform:scale(1) translateY(0);}}
.auth-close{position:absolute;top:14px;right:14px;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,0.15);border:none;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;z-index:10;font-size:14px;transition:all 0.15s;}
.auth-close:hover{background:rgba(255,255,255,0.25);}
.auth-hdr{padding:28px 26px 22px;background:var(--grad);text-align:center;}
.auth-hdr-logo{display:flex;align-items:center;justify-content:center;gap:9px;margin-bottom:10px;}
.auth-hdr-ico{width:40px;height:40px;background:rgba(255,255,255,0.2);border-radius:12px;display:flex;align-items:center;justify-content:center;border:2px solid rgba(255,255,255,0.3);}
.auth-hdr-name{font-size:22px;font-weight:800;color:#fff;letter-spacing:-0.5px;}
.auth-hdr-sub{font-size:13px;color:rgba(255,255,255,0.78);}
/* Steps */
.auth-dots{display:flex;align-items:center;justify-content:center;gap:7px;padding:16px 0 0;}
.adot{width:7px;height:7px;border-radius:50%;background:var(--bg3);transition:all 0.3s;}
.adot.active{background:var(--p1);transform:scale(1.3);}
.adot.done{background:var(--p1);opacity:0.4;}
.auth-body{padding:22px 26px 26px;}
.auth-step{display:none;}
.auth-step.active{display:block;}
/* Existing users */
.eu-list{display:flex;flex-direction:column;gap:7px;max-height:170px;overflow-y:auto;margin-bottom:14px;}
.eu-item{display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:12px;cursor:pointer;border:1.5px solid var(--bd);background:var(--bg3);transition:all 0.15s;}
.eu-item:hover{border-color:var(--p1);background:rgba(108,99,255,0.06);}
.eu-name{font-size:13px;font-weight:700;}
.eu-handle{font-size:11px;color:var(--t2);}
.eu-stats{font-size:10px;color:var(--t3);}
.auth-div{display:flex;align-items:center;gap:9px;margin:14px 0;font-size:11px;font-weight:600;color:var(--t3);}
.auth-div::before,.auth-div::after{content:'';flex:1;height:1px;background:var(--bd);}
/* Input */
.auth-lbl{font-size:11px;font-weight:700;color:var(--t2);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:5px;display:block;}
.auth-inp{width:100%;padding:12px 14px;background:var(--bg3);border:1.5px solid var(--bd);border-radius:11px;font-size:14px;outline:none;transition:all 0.2s;margin-bottom:12px;color:var(--t1);}
.auth-inp:focus{border-color:var(--p1);background:var(--bg1);box-shadow:0 0 0 3px rgba(108,99,255,0.1);}
.auth-inp::placeholder{color:var(--t3);}
/* OTP */
.otp-wrap{display:flex;gap:9px;justify-content:center;margin:14px 0;}
.otp-box{width:48px;height:56px;text-align:center;font-size:22px;font-weight:800;background:var(--bg3);border:2px solid var(--bd);border-radius:12px;outline:none;transition:all 0.2s;color:var(--t1);}
.otp-box:focus{border-color:var(--p1);background:var(--bg1);box-shadow:0 0 0 3px rgba(108,99,255,0.12);}
.otp-box.filled{border-color:var(--p1);background:rgba(108,99,255,0.05);}
